<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic Tiers</title>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #111d30;
      --panel2: #17263b;
      --blue: #38bdf8;
      --white: #f1f5f9;
      --muted: #94a3b8;
      --border: #263750;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
    }

    #snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    header,
    main,
    footer {
      position: relative;
      z-index: 1;
    }

    header {
      height: 68px;
      background: #101b2d;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(calc((100% - 1100px) / 2), 20px);
      gap: 20px;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--blue);
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: var(--blue);
    }

    main {
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .tab.active,
    .tab:hover {
      background: #15314a;
      border-color: var(--blue);
      color: var(--blue);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input {
      background: var(--panel);
      border: 1px solid var(--border);
      color: white;
      padding: 12px 14px;
      border-radius: 7px;
      outline: none;
      width: 260px;
    }

    input:focus {
      border-color: var(--blue);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      text-align: left;
      padding: 15px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #142237;
    }

    td {
      padding: 13px 15px;
      border-top: 1px solid var(--border);
    }

    .player {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
    }

    .head {
      width: 34px;
      height: 34px;
      image-rendering: pixelated;
    }

    tr.player-row {
      cursor: pointer;
    }

    tr.player-row:hover {
      background: var(--panel2);
    }

    .rank {
      color: var(--muted);
      width: 55px;
    }

    .tier {
      color: #7dd3fc;
      background: #15334b;
      border: 1px solid #245477;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .points {
      color: var(--muted);
    }

    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      padding: 25px;
      margin-top: 60px;
      font-size: 13px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000b;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2;
    }

    .modal.open {
      display: flex;
    }

    .profile {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 520px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .profile-top img {
      width: 75px;
      height: 75px;
      image-rendering: pixelated;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 22px;
    }

    .profile-item {
      background: var(--panel2);
      padding: 12px;
      border-radius: 7px;
    }

    .profile-item small {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .close {
      float: right;
      background: none;
      border: 0;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      nav {
        gap: 10px;
      }

      nav a {
        font-size: 12px;
      }

      main {
        margin-top: 28px;
      }

      h1 {
        font-size: 25px;
      }

      th,
      td {
        padding: 11px 8px;
        font-size: 12px;
      }

      .profile-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      input {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">❄ ARCTIC <span>TIERS</span></div>
    <nav>
      <a href="#">Home</a>
      <a href="#rankings">Rankings</a>
      <a href="#players">Players</a>
    </nav>
  </header>

  <main id="rankings">

      <tbody id="ranking"></tbody>

  </main>

  <div class="modal" id="modal">
    <div class="profile">
      <button class="close" onclick="closeProfile()" aria-label="Close profile">×</button>
      <div id="profileContent"></div>
    </div>
  </div>

  <footer>
    ❄ ARCTIC TIERS · Minecraft PvP Rankings
  </footer>
